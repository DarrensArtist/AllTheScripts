name: Deploy AllTheScripts website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble the public website
        shell: bash
        run: |
          source_dir="Development - AllTheScripts-Website"
          mkdir -p _site
          cp "$source_dir/index.html" _site/index.html
          cp "$source_dir/CNAME" _site/CNAME
          for folder in assets build content downloads pages scripts styling workflow; do
            cp -a "$source_dir/$folder" "_site/$folder"
          done
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
